plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

remapJar {
    destinationDirectory = rootProject.file("${output_directory}")
    archiveVersion = ""
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment "org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip"
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "maven.modrinth:modmenu:${fabric_modmenu_version}"

    modCompileOnly "maven.modrinth:spectrum:${fabric_spectrum_version}"
    modCompileOnly files('libs/fieldguide-fabric-1.21.1-1.15.2-patched.jar')
}

loom {
    mixin {
        defaultRefmapName.set "${mod_id}.refmap.json"
    }

    runs {
        client {
            client()
            runDir 'runs/client'
        }
        server {
            server()
            runDir 'runs/server'
        }
    }
}
