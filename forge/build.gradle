plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
    config "${mod_id}.forge.mixins.json"
}

jar {
    manifest {
        attributes([
                'MixinConfigs': "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
        ])
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') {
        version { strictly '5.0.4' }
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    reobf = false // If Minecraft version [1.20.6,) then false, true otherwise

    runs {
        client {
            taskName 'Client'
            workingDirectory file('runs/client')
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            taskName 'Server'
            workingDirectory file('runs/server')
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

sourceSets.each {
    def directory = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = directory
    it.java.destinationDirectory = directory
}
